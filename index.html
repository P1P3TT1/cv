<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pietari Pennanen – AI implementation, editorial workflows and learning materials. CV in English and Finnish.">
<title>Pietari – CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a textbook page – section names sit in a narrow margin column, content in a reading column; stacks on phones. */
:root {
  --paper: #f6f7f9;
  --ink: #1b1f27;
  --ink-soft: #545c6b;
  --rule: #d9dde4;
  --pencil: #2349c4;      /* editor's blue pencil */
  --on-pencil: #ffffff;
  --todo-bg: #fff1a8;
  --todo-ink: #5a4700;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161c; --ink: #e5e8ee; --ink-soft: #a3abb9; --rule: #2b313c;
    --pencil: #8aa6ff; --on-pencil: #0d1220; --todo-bg: #4a3f0c; --todo-ink: #ffe27a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161c; --ink: #e5e8ee; --ink-soft: #a3abb9; --rule: #2b313c;
  --pencil: #8aa6ff; --on-pencil: #0d1220; --todo-bg: #4a3f0c; --todo-ink: #ffe27a; color-scheme: dark;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.6;
  padding-inline: 1.25rem;
  padding-block: 2rem 4rem;
}
.sheet { max-width: 54rem; margin-inline: auto; display: grid; gap: 2.75rem; }

a { color: var(--pencil); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible { outline: 2px solid var(--pencil); outline-offset: 3px; border-radius: 2px; }

/* Top bar: draft note + language switch */
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem 1.5rem; }
.lang-switch { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; margin-left: auto; }
.lang-switch a {
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em;
  text-decoration: none; color: var(--ink-soft); padding: 0.2rem 0.75rem; border-radius: 999px;
}
.lang-switch a:hover { color: var(--ink); }
.lang-switch a[aria-current="true"] { background: var(--pencil); color: var(--on-pencil); }

.draft-note, .status, .colophon {
  font-family: var(--font-ui); font-size: 0.85rem; color: var(--ink-soft); margin: 0;
}
.colophon { border-top: 1px solid var(--rule); padding-top: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; justify-content: space-between; }
code { font-family: var(--font-data); font-size: 0.82rem; }
mark.todo {
  background: var(--todo-bg); color: var(--todo-ink);
  font-family: var(--font-ui); font-size: 0.85em; font-weight: 500;
  padding: 0.05em 0.35em; border-radius: 3px;
}

/* Masthead */
.masthead { display: grid; gap: 0.9rem; padding-bottom: 2rem; border-bottom: 1px solid var(--rule); }
.masthead.has-photo { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 1.25rem 2rem; }
.masthead .id { display: grid; gap: 0.9rem; min-width: 0; }
.portrait {
  display: block; width: 9rem; height: 9rem; max-width: 100%; object-fit: cover;
  border-radius: 6px; border: 1px solid var(--rule); background: var(--rule);
}
@media (max-width: 559px) {
  .masthead.has-photo { grid-template-columns: minmax(0, 1fr); }
  .portrait { width: 6.5rem; height: 6.5rem; }
}
.masthead h1 {
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(2.4rem, 7vw, 3.6rem); line-height: 1.05; letter-spacing: -0.015em;
  margin: 0; text-wrap: balance; font-variation-settings: "opsz" 72;
}
.role { font-family: var(--font-ui); font-size: 1.1rem; font-weight: 500; margin: 0; }
.role .sep { color: var(--pencil); padding-inline: 0.35em; }
.meta {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem;
  font-family: var(--font-ui); font-size: 0.92rem; color: var(--ink-soft);
}
.meta li { min-width: 0; overflow-wrap: anywhere; }

/* Sections */
.row { display: grid; gap: 0.75rem; }
@media (min-width: 760px) {
  .row { grid-template-columns: 9.5rem minmax(0, 1fr); gap: 2rem; }
}
.rail {
  font-family: var(--font-ui); font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--pencil); margin: 0; padding-top: 0.3rem;
  hyphens: manual;
}
.body { min-width: 0; display: grid; gap: 1.1rem; }
.body p { margin: 0; max-width: 65ch; hyphens: manual; }
.lede { font-size: 1.12rem; line-height: 1.55; }

/* Selected work */
.work { display: grid; gap: 0.35rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--rule); }
.work h3 {
  font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin: 0; line-height: 1.3;
  text-wrap: balance;
}
.k {
  font-family: var(--font-ui); font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--ink-soft); margin-right: 0.5em;
}
.stack { font-family: var(--font-ui); font-size: 0.9rem; color: var(--ink-soft); }
.try { font-family: var(--font-ui); font-size: 0.9rem; font-weight: 600; }
.also-head { margin-bottom: 0.5rem !important; }
.also { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.35rem; max-width: 65ch; }
.also li::marker, .job li::marker { color: var(--pencil); }

/* Experience */
.job { display: grid; gap: 0.3rem; }
.job-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.2rem 1rem; align-items: baseline; }
.job h3 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 0; }
.org { font-family: var(--font-ui); font-weight: 500; color: var(--ink-soft); }
.dates { font-family: var(--font-ui); font-size: 0.9rem; font-weight: 500; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.job ul { margin: 0.2rem 0 0; padding-left: 1.1rem; display: grid; gap: 0.3rem; max-width: 65ch; }

/* Skills */
.skills { display: grid; gap: 1rem 2rem; margin: 0; }
@media (min-width: 560px) { .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.skills div { min-width: 0; }
.skills dt { font-family: var(--font-ui); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.15rem; }
.skills dd { margin: 0; color: var(--ink-soft); font-size: 0.95rem; }

.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.4rem; }
.plain li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.1rem 1rem; }
.plain .cap::first-letter { text-transform: uppercase; }

@media (prefers-reduced-motion: no-preference) {
  a { transition: text-decoration-thickness 120ms ease, background-color 120ms ease, color 120ms ease; }
}

@media print {
  :root { --paper: #fff; --ink: #000; --ink-soft: #333; --rule: #bbb; --pencil: #1a3a9e; }
  body { padding: 0; font-size: 10pt; }
  .sheet { gap: 1.2rem; max-width: none; }
  .topbar, .colophon { display: none; }
  .work, .job { break-inside: avoid; }
  a { text-decoration: none; }
}
</style>
</head>
<body>

<main class="sheet" id="cv" lang="en">
  <p class="status">Loading CV…</p>
</main>

<script>
(function () {
  const root = document.getElementById('cv');
  const LANGS = ['en', 'fi'];
  const DEFAULT_LANG = 'en';
  const fileFor = (lang) => `cv.${lang}.json`;

  // Interface text. Everything else comes from cv.<lang>.json.
  const UI = {
    en: {
      locale: 'en-GB', name: 'English', switchLabel: 'Language',
      profile: 'Profile', work: 'Selected work', exp: 'Experience', skills: 'Skills', edu: 'Education', lang: 'Languages', interests: 'Outside work',
      outcome: 'Outcome', builtWith: 'Built with', alsoBuilt: 'Also built', tryIt: 'Try it', tryItInline: 'try it',
      countries: { FI: 'Finland' },
      range: (a, b) => `${a} – ${b || 'present'}`,
      monthYear: (y, m) => `${m}/${y}`,
      draft: (n, file) => `Draft: ${n} highlighted placeholder${n === 1 ? '' : 's'} like <mark class="todo">this</mark> still to fill in <code>${file}</code>.`,
      colophon: (link, updated) => `Built from ${link} in the JSON Resume format${updated ? ` · updated ${updated}` : ''}`,
      viewJson: 'View as JSON',
      loading: 'Loading CV…',
      error: (file, msg) => `Couldn't load <code>${file}</code> (${msg}). Keep it in the same folder as this page and open the page from a web server such as GitHub Pages. Browsers don't let a page opened straight from disk read other files.`
    },
    fi: {
      locale: 'fi-FI', name: 'Suomeksi', switchLabel: 'Kieli',
      profile: 'Profiili', work: 'Valittuja töitä', exp: 'Työkokemus', skills: 'Osaaminen', edu: 'Koulutus', lang: 'Kielitaito', interests: 'Vapaa-ajalla',
      outcome: 'Tulos', builtWith: 'Tekniikat', alsoBuilt: 'Muita töitä', tryIt: 'Kokeile', tryItInline: 'kokeile',
      countries: { FI: 'Suomi' },
      range: (a, b) => b ? `${a}–${b}` : `${a} alkaen`,
      monthYear: (y, m) => `${Number(m)}/${y}`,
      draft: (n, file) => `Luonnos: ${n} ${n === 1 ? 'korostettu kohta' : 'korostettua kohtaa'}, kuten <mark class="todo">tämä</mark>, on vielä täytettävä tiedostoon <code>${file}</code>.`,
      colophon: (link, updated) => `Koottu tiedostosta ${link} (JSON Resume -muoto)${updated ? ` · päivitetty ${updated}` : ''}`,
      viewJson: 'Näytä JSON-muodossa',
      loading: 'Ladataan ansioluetteloa…',
      error: (file, msg) => `Tiedostoa <code>${file}</code> ei voitu ladata (${msg}). Pidä se samassa kansiossa tämän sivun kanssa ja avaa sivu verkkopalvelimelta, esimerkiksi GitHub Pagesista. Selain ei anna suoraan levyltä avatun sivun lukea muita tiedostoja.`
    }
  };

  // Escape text, then turn [[placeholder]] into a highlighted mark.
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = (s) => esc(s).replace(/\[\[(.+?)\]\]/g, '<mark class="todo">$1</mark>');
  const shortUrl = (u) => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
  const ext = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;

  function render(cv, todoCount, lang) {
    const ui = UI[lang];
    const file = fileFor(lang);
    const date = (d) => {
      if (!d) return '';
      const m = /^(\d{4})-(\d{2})/.exec(d);
      return m ? ui.monthYear(m[1], m[2]) : t(d);
    };
    const section = (id, inner) => inner ? `
      <section class="row" aria-labelledby="h-${id}">
        <h2 class="rail" id="h-${id}">${ui[id]}</h2>
        <div class="body">${inner}</div>
      </section>` : '';

    const b = cv.basics || {};
    const loc = b.location || {};
    const label = (b.label || '').split(' / ').map(t).join('<span class="sep">/</span>');

    const contacts = [
      [loc.city, ui.countries[loc.countryCode] || loc.countryCode].filter(Boolean).map(esc).join(', '),
      b.email && `<a href="mailto:${esc(b.email)}">${t(b.email)}</a>`,
      b.phone && t(b.phone),
      ...(b.profiles || []).map((p) => p.url ? ext(p.url, esc(shortUrl(p.url))) : `${esc(p.network)}: ${t(p.username)}`)
    ].filter(Boolean).map((c) => `<li>${c}</li>`).join('');

    const [lede, ...rest] = (b.summary || '').split(/\n\s*\n/);
    const profile = (lede ? `<p class="lede">${t(lede)}</p>` : '') + rest.map((p) => `<p>${t(p)}</p>`).join('');

    const projects = cv.projects || [];
    const featured = projects.filter((p) => p.featured).map((p) => `
      <article class="work">
        <h3>${t(p.name)}</h3>
        ${p.description ? `<p>${t(p.description)}</p>` : ''}
        ${(p.highlights || []).map((h) => `<p><span class="k">${ui.outcome}</span>${t(h)}</p>`).join('')}
        ${p.keywords?.length ? `<p class="stack"><span class="k">${ui.builtWith}</span>${p.keywords.map(t).join(', ')}</p>` : ''}
        ${p.url ? `<p class="try">${ext(p.url, ui.tryIt)}</p>` : ''}
      </article>`).join('');
    const others = projects.filter((p) => !p.featured).map((p) =>
      `<li>${t(p.description || p.name)}${p.url ? ` – ${ext(p.url, ui.tryItInline)}` : ''}</li>`).join('');
    const work = featured + (others ? `<div><p class="stack also-head"><span class="k">${ui.alsoBuilt}</span></p><ul class="also">${others}</ul></div>` : '');

    const jobs = (cv.work || []).map((j) => `
      <div class="job">
        <div class="job-head">
          <h3>${t(j.position)} <span class="org">· ${t(j.name)}</span></h3>
          <span class="dates">${ui.range(date(j.startDate), date(j.endDate))}</span>
        </div>
        ${j.summary ? `<p>${t(j.summary)}</p>` : ''}
        ${j.highlights?.length ? `<ul>${j.highlights.map((h) => `<li>${t(h)}</li>`).join('')}</ul>` : ''}
      </div>`).join('');

    const skills = (cv.skills || []).length ? `<dl class="skills">${cv.skills.map((s) =>
      `<div><dt>${t(s.name)}</dt><dd>${(s.keywords || []).map(t).join(', ')}</dd></div>`).join('')}</dl>` : '';

    const edu = [
      ...(cv.education || []).map((e) => [[e.studyType, e.area, e.institution].filter(Boolean).map(t).join(', '), date(e.endDate)]),
      ...(cv.certificates || []).map((c) => [[c.name, c.issuer].filter(Boolean).map(t).join(', '), date(c.date)])
    ].map(([what, when]) => `<li><span>${what}</span><span class="dates">${when}</span></li>`).join('');

    const langs = (cv.languages || []).map((l) =>
      `<li><span class="cap">${t(l.language)}</span><span class="stack">${t(l.fluency)}</span></li>`).join('');

    let updated = '';
    if (cv.meta?.lastModified) {
      const d = new Date(cv.meta.lastModified + 'T12:00:00');
      updated = isNaN(d) ? esc(cv.meta.lastModified) : d.toLocaleDateString(ui.locale, { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const switcher = `<nav class="lang-switch" aria-label="${ui.switchLabel}">${LANGS.map((l) =>
      `<a href="#${l}" lang="${l}" hreflang="${l}" title="${UI[l].name}"${l === lang ? ' aria-current="true"' : ''}>${l.toUpperCase()}</a>`).join('')}</nav>`;

    root.innerHTML = `
      <div class="topbar">
        ${todoCount ? `<p class="draft-note">${ui.draft(todoCount, file)}</p>` : ''}
        ${switcher}
      </div>
      <header class="masthead${b.image ? ' has-photo' : ''}">
        ${b.image ? `<img class="portrait" src="${esc(b.image)}" alt="${esc(b.name)}" width="480" height="480">` : ''}
        <div class="id">
          <h1>${t(b.name)}</h1>
          ${label ? `<p class="role">${label}</p>` : ''}
          <ul class="meta">${contacts}</ul>
        </div>
      </header>
      ${section('profile', profile)}
      ${section('work', work)}
      ${section('exp', jobs)}
      ${section('skills', skills)}
      ${section('edu', edu && `<ul class="plain">${edu}</ul>`)}
      ${section('lang', langs && `<ul class="plain">${langs}</ul>`)}
      ${section('interests', (cv.interests || []).map((i) => `<p>${t(i.name)}</p>`).join(''))}
      <footer class="colophon">
        <span>${ui.colophon(ext(file, `<code>${file}</code>`), updated)}</span>
        ${ext(file, ui.viewJson)}
      </footer>`;
  }

  const cache = {};
  const currentLang = () => {
    const fromHash = location.hash.slice(1).toLowerCase();
    return LANGS.includes(fromHash) ? fromHash : DEFAULT_LANG;
  };
  function load() {
    const lang = currentLang();
    document.documentElement.lang = lang;
    root.lang = lang;
    const file = fileFor(lang);
    const job = cache[lang] || (cache[lang] = fetch(file, { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
      .then((text) => ({ cv: JSON.parse(text), todos: (text.match(/\[\[.+?\]\]/g) || []).length })));
    if (!root.querySelector('.masthead')) root.innerHTML = `<p class="status">${UI[lang].loading}</p>`;
    job.then(({ cv, todos }) => { if (lang === currentLang()) render(cv, todos, lang); })
      .catch((err) => {
        delete cache[lang];
        if (lang !== currentLang()) return;
        root.innerHTML = `<p class="status">${UI[lang].error(file, esc(err.message))}</p>`;
      });
  }

  window.addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>
